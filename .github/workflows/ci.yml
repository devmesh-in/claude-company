name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push/PR update wins).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # No dependencies: the package has none, so there is nothing to install.
      # The suites only `git init` temp repos and never commit (the hook suite
      # sets its own local user.email/name), so no global git identity is needed.
      - name: CLI wrapper tests
        run: bash tests/cli/test_cli.sh
      - name: Installer TUI tests
        run: bash tests/install/test_tui.sh
      - name: Installer + gates tests
        run: bash tests/install/run_tests.sh
      # run_tests.sh does NOT cover update: test_update.sh is a separate file and
      # was only ever reached through package.json prepublishOnly, so its 139
      # cases - including the whole legacy field-install rollout proof - never ran
      # on a PR. Same class of hole as the run_tests.sh direct-exec bug (W-030).
      - name: Update engine tests
        run: bash tests/install/test_update.sh
      - name: Hook tests
        run: bash tests/hooks/run_tests.sh
      - name: Syntax check bin and lib
        run: node --check bin/claude-company.js && node --check lib/install-tui.js

  pack:
    name: pack manifest and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: npm pack --dry-run and assert contents + size
        run: |
          set -euo pipefail
          PACK_LOG="$(mktemp)"
          npm pack --dry-run 2>&1 | tee "$PACK_LOG"

          echo "== assert required paths present in the tarball =="
          for f in \
            ".claude/agents/developer.md" \
            ".claude/settings.json" \
            ".mcp.json" \
            "install" \
            "install.sh" \
            "lib/install-tui.js"; do
            esc="$(printf '%s' "$f" | sed 's/[.[\*^$/]/\\&/g')"
            if grep -qE "^npm notice[[:space:]].*[[:space:]]${esc}\$" "$PACK_LOG"; then
              echo "  ok  present: $f"
            else
              echo "  ERROR: $f is missing from the tarball"; exit 1
            fi
          done

          echo "== assert dev-only paths absent from the tarball =="
          for pat in "tests/" ".assets/" "__pycache__"; do
            esc="$(printf '%s' "$pat" | sed 's/[.[\*^$/]/\\&/g')"
            if grep -E "^npm notice" "$PACK_LOG" | grep -qE "[[:space:]]${esc}"; then
              echo "  ERROR: $pat must not be in the tarball"; exit 1
            else
              echo "  ok  absent: $pat"
            fi
          done

          echo "== assert unpacked size is under 2 MB =="
          SIZE_LINE="$(grep -iE '^npm notice[[:space:]]+unpacked size:' "$PACK_LOG" | tail -1)"
          echo "  $SIZE_LINE"
          VAL="$(printf '%s' "$SIZE_LINE" | sed -E 's/.*unpacked size:[[:space:]]*([0-9.]+)[[:space:]]*([kKmMgG]?B).*/\1/')"
          UNIT="$(printf '%s' "$SIZE_LINE" | sed -E 's/.*unpacked size:[[:space:]]*([0-9.]+)[[:space:]]*([kKmMgG]?B).*/\2/')"
          BYTES="$(awk -v v="$VAL" -v u="$UNIT" 'BEGIN{
            m=1;
            if(u=="kB")m=1000; else if(u=="MB")m=1000*1000; else if(u=="GB")m=1000*1000*1000;
            printf "%d", v*m }')"
          LIMIT=$((2*1024*1024))
          echo "  parsed ${VAL}${UNIT} = ${BYTES} bytes (limit ${LIMIT})"
          if [ "$BYTES" -lt "$LIMIT" ]; then
            echo "  ok  unpacked size is under 2 MB"
          else
            echo "  ERROR: unpacked size ${VAL}${UNIT} exceeds the 2 MB budget"; exit 1
          fi

  readme:
    name: readme structure and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The hero and dropdowns are raw HTML that markdown formatters have
      # stripped before; fail loudly if it ever happens again.
      - name: README keeps its hero and dropdowns
        run: |
          set -euo pipefail
          grep -q '<img src=".assets/banner.png"' README.md
          grep -q '<div align="center">' README.md
          test "$(grep -c '<details>' README.md)" -ge 5
          grep -q 'img.shields.io' README.md
          echo "ok: hero, centering, badges, and dropdowns present"
      - name: Relative links resolve
        run: |
          set -euo pipefail
          fail=0
          for f in README.md docs/*.md; do
            # extract relative markdown link targets (skip http, anchors, mailto)
            for t in $(grep -oE '\]\(([^)#]+)' "$f" | sed 's/](//' | grep -vE '^(http|mailto:)' | sort -u); do
              rel="$(dirname "$f")/$t"
              if [ ! -e "$t" ] && [ ! -e "$rel" ]; then
                echo "BROKEN: $f -> $t"; fail=1
              fi
            done
          done
          exit $fail

  slop:
    name: writing gate (no-slop punctuation scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked text for banned punctuation
        run: |
          set -uo pipefail
          # Reject em/en dashes, the horizontal bar, smart quotes, and the
          # ellipsis char (mirrors the no_slop hook tells). Skips .assets/ and
          # the two files where these glyphs are legitimate data: the hook's own
          # tell table and the test that feeds it em-dash fixtures.
          git ls-files '*.md' '*.py' '*.js' '*.sh' '*.json' \
            | grep -Ev '^\.assets/|^\.claude/hooks/no_slop\.py$|^tests/hooks/test_hooks\.py$' \
            | perl -CSD -ne '
                chomp(my $f = $_);
                open(my $fh, "<:encoding(UTF-8)", $f) or next;
                while (my $line = <$fh>) {
                  if ($line =~ /([\x{2013}\x{2014}\x{2015}\x{201C}\x{201D}\x{2018}\x{2019}\x{2026}])/) {
                    printf "SLOP: %s:%d: %s", $f, $., $line;
                    $hit = 1;
                  }
                }
                close($fh);
                END { exit($hit ? 1 : 0); }
              '
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "writing gate: clean"
          else
            echo "writing gate: banned punctuation found (see SLOP: lines above); use ASCII punctuation"
          fi
          exit "$rc"

  canon:
    name: canon names every CI suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CLAUDE.md claimed two suites gated this repo while CI ran five. The
      # wrong count propagated into three sealed briefs, and a lane shipped a
      # red branch because nobody ran the suite that would have caught it.
      # That is the third time canon and CI have disagreed about this repo, so
      # the disagreement is a red gate from here on.
      - name: Every suite CI runs is named in CLAUDE.md
        run: |
          set -euo pipefail
          # Overridable so the check can be demonstrated against a doctored
          # copy of the canon without editing the repo's own canon.
          CANON_FILE="${CANON_FILE:-CLAUDE.md}"
          export CANON_FILE
          python3 - <<'PY'
          import os
          import re
          import sys

          WORKFLOW = ".github/workflows/ci.yml"
          CANON = os.environ["CANON_FILE"]

          # The suite list is derived from this workflow, never from a hand
          # kept list: a second list would just be one more copy of canon that
          # can drift. A suite invocation is a command whose first word is an
          # interpreter and whose arguments carry a tests/ path. That shape is
          # what keeps the tests/ strings living inside grep patterns and for
          # loops (the slop and pack jobs) out of the list.
          INTERPRETERS = ("bash", "sh", "zsh", "python", "python3", "node")

          def clean(tok):
              return tok.strip("\"'`;,()[]")

          suites = []
          step_of = {}
          step = "(unnamed step)"
          with open(WORKFLOW, encoding="utf-8") as fh:
              for raw in fh:
                  line = raw.strip()
                  named = re.match(r"^(?:-\s+)?name:\s*(.+)$", line)
                  if named:
                      step = named.group(1).strip()
                  if line.endswith("\\"):
                      line = line[:-1].strip()
                  match = re.match(r"^(?:-\s+)?run:\s*(.*)$", line)
                  cmd = match.group(1) if match else line
                  toks = [clean(t) for t in cmd.split()]
                  if not toks or toks[0] not in INTERPRETERS:
                      continue
                  for tok in toks[1:]:
                      if tok.startswith("tests/") and tok not in suites:
                          suites.append(tok)
                          step_of[tok] = step

          if not suites:
              print("canon check: found no suite invocations in %s" % WORKFLOW)
              print("the parser no longer matches how this workflow runs its suites; fix the parser")
              sys.exit(1)

          # Gate documentation means the fenced code blocks of the canon file,
          # not the whole file. The Layout table already mentions tests/cli and
          # tests/install in passing, so a whole file scan would accept a canon
          # that documents no gates at all.
          gate = []
          inside = False
          with open(CANON, encoding="utf-8") as fh:
              for raw in fh:
                  if raw.lstrip().startswith("```"):
                      inside = not inside
                      continue
                  if inside:
                      gate.append(raw)
          gate_text = "".join(gate)

          def directory_of(path):
              return path.rsplit("/", 1)[0] if "/" in path else path

          per_dir = {}
          for suite in suites:
              key = directory_of(suite)
              per_dir[key] = per_dir.get(key, 0) + 1

          # Matching rule, narrowest that still accepts a correct canon:
          # a suite counts as named when the gate block mentions its exact test
          # path, OR mentions its test directory AND that directory holds only
          # one of the suites CI runs. The directory arm is what accepts the
          # hook suite, which canon names as an equivalent command
          # (python3 -m unittest discover -s tests/hooks -q) rather than as
          # bash tests/hooks/run_tests.sh. It is capped at one suite per
          # directory on purpose: tests/install holds three, so a bare
          # tests/install mention would hide two dropped suites.
          missing = []
          for suite in suites:
              key = directory_of(suite)
              if suite in gate_text:
                  continue
              if per_dir[key] == 1 and key in gate_text:
                  continue
              missing.append(suite)

          print("canon check: %s vs %s" % (WORKFLOW, CANON))
          for suite in suites:
              print("  %-30s %s" % (suite, "UNNAMED" if suite in missing else "named"))

          if missing:
              print("")
              print("FAIL: %d of %d suites CI runs are not named in the gate block of %s"
                    % (len(missing), len(suites), CANON))
              for suite in missing:
                  print("")
                  print("  unnamed suite : %s" % suite)
                  print("  run by        : %s, step '%s'" % (WORKFLOW, step_of[suite]))
                  print("  to fix        : add a line naming %s to the fenced gate block in %s"
                        % (suite, CANON))
                  print("                  (the exact path, or an equivalent command that contains it)")
              sys.exit(1)

          print("")
          print("ok: all %d suites CI runs are named in the gate block of %s" % (len(suites), CANON))
          PY

  hooks:
    name: every enforcement hook is loadable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hooks fail OPEN on purpose: an internal error lets the action through
      # rather than jamming a session. A SYNTAX error is not an internal error
      # - python never reaches the code that would decide - and the
      # interpreter exits 1, while only exit 2 blocks. So one stray character
      # disarms a guard completely and SILENTLY: no block, no message, nothing
      # in the session saying enforcement stopped existing. Confirmed rather
      # than reasoned about, 2026-08-13: `def broken(:` appended to a COPY of
      # guard_frozen.py, fed an Edit on a frozen path, gave exit 1 and the
      # edit went through.
      #
      # CI syntax-checked the two JS entrypoints and nothing at all under
      # .claude/hooks/ until this job existed. The wiring gate proves a hook is
      # WIRED and the canon job proves doctrine matches reality; this proves
      # the hook is LOADABLE, which the other two both assume.
      - name: Every hook under .claude/hooks parses
        run: |
          set -euo pipefail
          # Overridable so the check can be demonstrated against a doctored
          # COPY of the hooks, never by breaking a real one.
          HOOKS_DIR="${HOOKS_DIR:-.claude/hooks}"
          export HOOKS_DIR
          python3 - <<'PY'
          import ast
          import os
          import sys

          hooks_dir = os.environ["HOOKS_DIR"]

          # Derived from the directory, never from a hand kept list: a list
          # here would be one more copy of canon that drifts, which is the
          # exact defect the sibling canon job exists to catch. A new hook is
          # covered the moment it lands.
          names = sorted(n for n in os.listdir(hooks_dir) if n.endswith(".py"))
          if not names:
              print("ERROR: no .py files found under %s" % hooks_dir)
              sys.exit(1)

          print("hook load check: %d files under %s" % (len(names), hooks_dir))

          # ast.parse, never import: importing runs module-level code, and
          # several hooks read stdin at import time, so an import-based check
          # would hang this job rather than fail it.
          #
          # feature_version pins the Python 3.8 floor CLAUDE.md documents, so
          # syntax newer than the floor fails HERE instead of on the machine of
          # whoever installed this. It checks GRAMMAR only - a 3.9+ library
          # call parses fine and is not this gate's job.
          failures = []
          for name in names:
              path = os.path.join(hooks_dir, name)
              with open(path, "rb") as fh:
                  source = fh.read()
              try:
                  ast.parse(source, filename=path, feature_version=(3, 8))
              except SyntaxError as exc:
                  failures.append((name, exc))
                  print("  FAIL  %s" % name)
              else:
                  print("  ok    %s" % name)

          if failures:
              print("")
              print("FAIL: %d of %d hooks do not parse on the documented "
                    "Python 3.8 floor" % (len(failures), len(names)))
              for name, exc in failures:
                  print("")
                  print("  hook      : %s" % os.path.join(hooks_dir, name))
                  print("  line %s   : %s" % (exc.lineno, (exc.text or "").rstrip()))
                  print("  error     : %s" % exc.msg)
                  print("  why it is a red gate: python exits 1 on this file, "
                        "and only exit 2 blocks, so this hook currently")
                  print("                       enforces NOTHING and says so "
                        "to nobody. Fix the syntax; do not unwire the hook.")
              sys.exit(1)

          print("")
          print("ok: all %d hooks parse on the Python 3.8 floor" % len(names))
          PY
